# Full scale for 128K vocab tokenizers.
# nanochat d24 architecture: ~682M transformer, ~1.27B total with 128K vocab.
# Multi-node (4 nodes × 4 GPUs = 16 GPUs).
# ~9.2B tokens, ~8,800 steps, ~4.5h estimated wall time.

name: full-128k

model:
  n_layer: 24
  n_embd: 1536              # nanochat default: depth * 64 = 24 * 64 = 1536
  n_kv_head: 12              # MHA: n_head = n_embd / head_dim = 1536 / 128 = 12
  sequence_len: 2048
  window_pattern: "SSSL"
  ve_dim: 128                # cap VE embedding dim (prevents VE dominating at 128K vocab)

training:
  target_param_data_ratio: 10.5
  num_iterations: -1
  total_batch_size: 1048576
  device_batch_size: 16
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  eval_tokens: 41943040
  compile: true

optimizer:
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.28         # base value; auto-scaled via T_epoch framework in train.py
  width_lr_exponent: -1.0

data:
  data_dir: null

logging:
  eval_every: 500
  save_every: 500
  max_checkpoints: 0

wandb:
  enabled: true
  project: tokenizer-lm
  run_name: null

output_dir: /capstor/scratch/cscs/${USER}/tokenizer-lm/checkpoints

seed: 42
