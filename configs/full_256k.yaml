# Full scale for 256K vocab tokenizers.
# ~1.2B transformer params. Multi-node (4+ nodes × 4 GPUs).
# Same transformer as 64K/128K, larger embeddings.

name: full-256k

model:
  n_layer: 24
  n_embd: 2048
  n_kv_head: 16
  head_dim: 128
  sequence_len: 2048
  window_pattern: "SSSL"
  ve_dim: 128

training:
  target_param_data_ratio: 10.5
  num_iterations: -1
  total_batch_size: 2097152
  device_batch_size: 8
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  eval_tokens: 41943040
  compile: true

optimizer:
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.28
  width_lr_exponent: -1.0

data:
  data_dir: null

logging:
  eval_every: 500
  save_every: 2500

wandb:
  enabled: true
  project: tokenizer-lm
  run_name: null

output_dir: /capstor/scratch/cscs/${USER}/tokenizer-lm/checkpoints

seed: 42
