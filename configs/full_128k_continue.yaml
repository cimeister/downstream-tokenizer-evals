# Continue training existing 1B models on the standard data mixture.
# Same d24 architecture, 10B additional tokens on the original training data.
# Resumed from existing full-128k checkpoints.
# ~9,536 steps at 1M batch size, ~5h wall time (single node 4×GH200).

name: full-128k-continue

model:
  n_layer: 24
  n_embd: 1536
  n_kv_head: 12
  sequence_len: 2048
  window_pattern: "SSSL"
  ve_dim: 128

training:
  target_param_data_ratio: -1   # fixed token budget
  max_tokens: 10000000000       # 10B tokens
  num_iterations: -1            # auto-compute from max_tokens
  total_batch_size: 1048576
  device_batch_size: 16
  warmup_steps: 40
  warmdown_ratio: 0.65
  final_lr_frac: 0.05
  eval_tokens: 41943040
  compile: true

optimizer:
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.28
  width_lr_exponent: -1.0

data:
  data_dir: null

logging:
  eval_every: 500
  save_every: 500
  max_checkpoints: 0

wandb:
  enabled: true
  project: tokenizer-lm
  run_name: null

output_dir: /capstor/scratch/cscs/${USER}/tokenizer-lm/checkpoints

seed: 42
