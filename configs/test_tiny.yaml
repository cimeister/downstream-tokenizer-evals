# Tiny test config for smoke-testing the training pipeline.
# ~4M params, 20 steps, single GPU.

name: test-tiny

model:
  n_layer: 4
  n_embd: 256
  n_kv_head: 2
  head_dim: 128
  sequence_len: 512
  window_pattern: "SL"
  ve_dim: 128

training:
  target_param_data_ratio: -1
  num_iterations: 20
  total_batch_size: 4096       # 8 sequences * 512 tokens
  device_batch_size: 8
  warmup_steps: 5
  warmdown_ratio: 0.3
  final_lr_frac: 0.1
  eval_tokens: 4096
  compile: false               # skip compile for fast startup

optimizer:
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.28

data:
  data_dir: /capstor/scratch/cscs/cmeister747/data/test-tiny

logging:
  eval_every: 10
  save_every: -1

wandb:
  enabled: false

output_dir: /capstor/scratch/cscs/cmeister747/tokenizer-lm/checkpoints

seed: 42
