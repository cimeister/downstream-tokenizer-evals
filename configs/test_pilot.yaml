# Test config: pilot-scale architecture, 50 steps, with torch.compile.
# Tests multi-GPU, compile, real optimizer dynamics, checkpointing.

name: test-pilot

model:
  n_layer: 12
  n_embd: 768
  n_kv_head: 6
  head_dim: 128
  sequence_len: 2048
  window_pattern: "SSSL"

training:
  target_param_data_ratio: -1
  num_iterations: 50
  total_batch_size: 65536      # 32 sequences * 2048 tokens
  device_batch_size: 8
  warmup_steps: 10
  warmdown_ratio: 0.3
  final_lr_frac: 0.1
  eval_tokens: 65536
  compile: true

optimizer:
  matrix_lr: 0.02
  embedding_lr: 0.3
  unembedding_lr: 0.008
  scalar_lr: 0.5
  weight_decay: 0.28

data:
  data_dir: /capstor/scratch/cscs/cmeister747/data/test-pilot

logging:
  eval_every: 25
  save_every: 50

wandb:
  enabled: false

output_dir: /capstor/scratch/cscs/cmeister747/tokenizer-lm/checkpoints

seed: 42
