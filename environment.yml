# Environment for tokenizer-lm.
#
# On CSCS Clariden, use the uenv system:
#   uenv start pytorch/v2.8.0:v1 --view=default
#   python -m venv --system-site-packages .venv
#   source .venv/bin/activate
#   pip install -e ./nanochat  # or add nanochat/ to PYTHONPATH
#   pip install datasets pyarrow wandb lm-eval evaluate sentencepiece
#
# For local dev with conda:
#   conda env create -f environment.yml
#   conda activate tokenizer-lm

name: tokenizer-lm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.9
  - pip
  - pip:
    - torch==2.9.1
    - numpy==1.26.4
    - transformers==4.57.3
    - tokenizers==0.22.1
    - datasets==4.0.0
    - pyarrow==18.1.0
    - wandb==0.21.3
    - lm-eval==0.4.8
    - evaluate==0.4.3
    - sentencepiece==0.2.0
    - pyyaml==6.0.2
    - tiktoken==0.11.0
    - rustbpe==0.1.0
    - zstandard==0.25.0
    - tabulate==0.9.0
    - safetensors==0.5.3
    - huggingface-hub==0.30.2
